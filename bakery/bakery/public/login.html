<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bakery System - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/login.css" />
</head>

<body>

  <div class="page">

    <div class="visual-panel" role="img" aria-label="Freshly baked bread loaves on a wooden board">
      <div class="visual-panel__tag">
        <span class="visual-panel__crumb">&#9741;</span>
        Flour &amp; Ember Bakery
      </div>
    </div>

    <div class="form-panel">
      <div class="container">

        <p class="eyebrow">Good to see you again</p>
        <h2>Welcome Back</h2>
        <p class="subtitle">Sign in to manage orders, recipes and the day's bake list.</p>

        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" placeholder="you@flourandember.com" />

        <label class="field-label" for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" />

        <button onclick="loginUser()">Login</button>

        <p class="message" id="message"></p>

        <p class="link">
          Don't have an account? <a href="register.html">Register</a>
        </p>

      </div>
    </div>

  </div>

  <script src="js/login.js"></script>

</body>
</html>
