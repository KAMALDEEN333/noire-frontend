<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakery Customer Dashboard</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>

<div class="dashboard-container">

    <header>
        <div class="header-content">
            <div class="brand">
                <h1>Bakery Ordering & Event Booking</h1>
            </div>

            <div class="user-profile">
                <span id="userEmail">Loading...</span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>

        <nav class="tabs">
            <button class="tab-btn active" data-section="products">Available Products</button>
            <button class="tab-btn" data-section="orders">My Placed Orders</button>
            <button class="tab-btn" data-section="bookings">Event Bookings</button>
            <button class="tab-btn" data-section="profile">My Profile</button>
        </nav>
    </header>

    <main>

        <section id="products" class="content-section">
            <div class="section-header">
                <h2>Available Products</h2>
            </div>
            <div id="products-list" class="grid-container">
                <p class="status-msg">Loading products...</p>
            </div>
        </section>

        <section id="orders" class="content-section hidden">
            <div class="section-header">
                <h2>Your Order History</h2>
            </div>
            <div id="orders-list" class="grid-container">
                </div>
        </section>

        <section id="bookings" class="content-section hidden">
            <div class="section-header">
                <h2>Your Event Reservations</h2>
                <button id="btn"  class="btn-confirm" onclick="openBookingModal()">
                    + New Event Booking
                </button>
            </div>
            <div id="bookings-list" class="grid-container">
                </div>
        </section>
        
        <section id="profile" class="content-section hidden">
    <div class="section-header">
        <h2>Update Profile</h2>
    </div>

    <div class="form-container">

        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="profileName" placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label>Phone</label>
            <input type="text" id="profilePhone" placeholder="Enter phone number">
        </div>

        <div class="form-group">
            <label>Street</label>
            <input type="text" id="profileStreet" placeholder="Street address">
        </div>

        <div class="form-group">
            <label>City</label>
            <input type="text" id="profileCity" placeholder="City">
        </div>

        <div class="form-group">
            <label>State</label>
            <input type="text" id="profileState" placeholder="State">
        </div>

        <div class="form-group">
            <label>Postal Code</label>
            <input type="text" id="profilePostalCode" placeholder="Postal Code">
        </div>

        <button class="btn-confirm" onclick="updateProfile()">
            Update Profile
        </button>

        <p id="profileMsg" class="status-msg"></p>

    </div>
</section>

    </main>
</div>

<div id="orderModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeOrderModal()"></div>
    <div class="modal-card">
        <div class="modal-header">
            <h3>Place Your Order</h3>
            <button onclick="closeOrderModal()">&times;</button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="orderProductId">
            <div class="form-group">
                <label>Quantity</label>
                <input type="number" id="orderQty" min="1" value="1">
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeOrderModal()">Cancel</button>
            <button class="btn-confirm" onclick="submitOrder()">Continue to Payment</button>
        </div>
    </div>
</div>

<div id="paymentModal" class="modal hidden">
    <div class="modal-overlay" onclick="closePaymentModal()"></div>
    <div class="modal-card">
        <div class="modal-header">
            <h3>Complete Payment</h3>
            <button onclick="closePaymentModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="payment-form-content">
                <div class="form-group">
                    <label>Card Number</label>
                    <input type="number" id="cardNumber" placeholder="1234 5678 9012 3456" >
                </div>
                <div class="form-group">
                    <label>Expiry Date</label>
                    <input type="month" id="expiryDate">
                </div>
                <div class="form-group">
                    <label>CVV</label>
                    <input type="tel" id="cvv" placeholder="123" >
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="text" id="paymentAmount" disabled style="font-weight: bold; color: #2d3436;">
                </div>
            </div>

            <div id="payment-processing" class="hidden" style="text-align: center; padding: 20px;">
                <div class="spinner"></div>
                <p><strong>Processing payment...</strong></p>
                <p>Please do not refresh the page.</p>
            </div>

            <p id="paymentStatusMsg" class="status-msg"></p>
        </div>
        <div class="modal-footer" id="payment-footer">
            <button class="btn-cancel" onclick="closePaymentModal()">Cancel</button>
            <button class="btn-confirm" id="payBtn" onclick="processPayment()">Pay Now</button>
        </div>
    </div>
</div>

<div id="bookingModal" class="modal hidden">
    <div class="modal-overlay" onclick="closeBookingModal()"></div>
    <div class="modal-card">
        <div class="modal-header">
            <h3>Create Event Booking</h3>
            <button onclick="closeBookingModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label>Event Date</label>
                <input type="date" id="bookingDate">
            </div>
            <div class="form-group">
                <label>Location</label>
                <input type="text" id="bookingLocation" placeholder="e.g. Abuja Hall, Wuse 2">
            </div>
            <div class="form-group">
                <label>Select Service</label>
                <select id="booking-service-dropdown">
                    <option value="">-- Choose a Service --</option>
                </select>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeBookingModal()">Cancel</button>
            <button class="btn-confirm" onclick="submitBooking()">Continue to Payment</button>
        </div>
    </div>
</div>






<script src="/js/dashboard.js"></script>

</body>
</html>
